[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomi-syl"
version = "0.2.4"
description = "A modular, dialect-aware Zomi syllabification library with rule-based and CRF backends."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
dependencies = [
    "joblib",
    "numpy>=1.24",
    "regex>=2023.0",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "click>=8.1",
    "python-crfsuite>=0.9.7",
    # Note: FST, LSTM and Torch are optional backends
]

[project.license]
text = "MIT"

authors = [
    { name = "ZomiLearner" }
]

keywords = [
    "bilstm", "crf", "dialect", "fst", "gangte", 
    "india-zomi", "kom", "linguistics", "myanmar-zomi", 
    "nlp", "paite", "phonology", "simte", "syllabification", 
    "tedim", "thado/thadou", "thangkhal", "transformer", 
    "vaiphei", "zo/zou", "zomi", "zomi-community"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.build]
wheel-dir = "dist"

dependencies = [
    "joblib",
    "numpy>=1.24",
    "regex>=2023.0",
    "pydantic>=2.0",
    "huggingface_hub>=0.23",
    "tqdm>=4.66",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "ipython",
    "jupyter",
]

train = [
    "datasets>=2.18",
]

crf = [
    "python-crfsuite>=0.9.7"
]

fst = [
    "openfst-python>=1.8",
]

torch = [
    "torch>=2.2",
]

all = [
    "python-crfsuite>=0.9.7",
    "openfst-python>=1.8",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://ZomiLearner.github.io/zomi-syl/"
Documentation = "https://ZomiLearner.github.io/zomi-syl"
Source = "https://github.com/ZomiLearner/zomi-syl"
Issues = "https://github.com/ZomiLearner/zomi-syl/issues"
Changelog = "https://ZomiLearner.github.io/zomi-syl/changelog/"

[project.scripts]
zomi-syl = "zomi_syl.cli:main"

[tool.setuptools]
packages = ["zomi_syl"]
package-dir = {"" = "src"}
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.package-data]
"zomi_syl" = [
    "py.typed",
    "resources/*.json",
    "models/**/*.joblib",
    "models/**/*.crfsuite",
    "models/**/*.json",
    "models/**/*.txt",
    "config/*.toml",
    "config/*.json",
    "profiles/*/*.json",
    "profiles/*/*.txt",
    "rule_based/*.py"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-warnings --maxfail=1"